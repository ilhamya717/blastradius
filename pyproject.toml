[project]
name = "blastradius"
version = "0.1.0"
description = "Supply-chain blast radius simulator: reachability-aware SCA for Python projects"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "packaging>=23.0",
    "rich>=13.0",
]

[project.scripts]
blastradius = "blastradius.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blastradius*"]
